<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="menu-card">
        <h1 id="welcomeMsg">Cargando...</h1>
        <div class="options-grid">
        <div class="option-item" onclick="location.href='/ventas'">
            <h3>🛒 Ventas</h3>
            <p>Registrar salida de productos</p>
        </div>
        <div class="option-item" onclick="location.href='/productos'">
            <h3>📦 Inventario</h3>
            <p>Ver y editar stock</p>
        </div>
        <div class="option-item" onclick="location.href='/alertas'">
            <h3>⚠️ Alertas</h3>
            <p>Productos por agotarse</p>
        </div>
    </div>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>

    <script>
        // el script de fetch 
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/perfil')
                .then(response => response.ok ? response.json() : (window.location.href = '/'))
                .then(data => {
                    if (data && data.autenticado) {
                        document.getElementById('welcomeMsg').textContent = `Bienvenido, ${data.nombre} (${data.rol})`;
                    }
                })
                .catch(() => window.location.href = '/');
        });

        function logout() {
            window.location.href = '/logout';
        }
    </script>
</body>
</html>
